<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #ship {
            width: 400px;
            height: 400px;
        }

        #error {
            display: none;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: large;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>
    <canvas id="ship" width="400" height="400"></canvas>
    <h1 id="error">WebGL not supported...</h1>

    <script>
        (() => {
            const canvas = document.getElementById('ship');
            const error = document.getElementById('error');
            const gl = canvas.getContext('webgl');

            if (!gl) {
                error.style.display = 'block';
                return;
            }

        })();
    </script>
</body>

</html>
